server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Immer beim Server nachfragen (ETag): neue Builds kommen sofort an, der Service Worker
    # erkennt Updates; offline liefert er selbst aus seinem Cache
    add_header Cache-Control "no-cache" always;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream text/css;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # PWA-Manifest (fehlt in mime.types)
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }
}
