server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Während der Entwicklung nichts cachen, damit neue Builds sofort ankommen
    add_header Cache-Control "no-cache" always;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream text/css;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
}
