<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Schicksalsklinge</title>
<style>
	:root {
		--bg: #14110f;
		--panel: #221d19;
		--knopf: #3a312a;
		--knopf-aktiv: #6b5636;
		--rand: #5a4a3a;
		--text: #e8dcc8;
		--leise: #a39480;
		--gold: #c9a45c;
		--leiste: 13.5rem;
	}
	* { box-sizing: border-box; }
	html, body {
		margin: 0; height: 100%;
		background: var(--bg); color: var(--text);
		font: 16px/1.3 system-ui, sans-serif;
		overscroll-behavior: none;
		-webkit-user-select: none; user-select: none;
		-webkit-touch-callout: none;
	}
	body {
		display: flex; flex-direction: column;
		height: 100dvh;
		padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	}
	canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
	#status {
		position: fixed; inset: 0; z-index: 5;
		display: flex; align-items: center; justify-content: center;
		color: var(--leise); font-size: 0.95rem; text-align: center; padding: 1rem;
		pointer-events: none;
	}

	/* ---------- Layout „Original“: das ganze 320x200-Bild ---------- */
	#buehne {
		flex: 1; min-height: 0;
		display: flex; align-items: center; justify-content: center;
	}
	#bild {
		aspect-ratio: 4 / 3;
		width: min(100%, calc((100dvh - var(--leiste) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 4 / 3));
		background: #000;
	}
	#canvas { width: 100%; height: 100%; }
	body.mobil #buehne { display: none; }
	/* SDL braucht die Canvas weiterhin, im mobilen Layout unsichtbar */
	body.mobil #canvas { position: absolute; left: 0; top: 0; width: 1px; height: 1px; visibility: hidden; }
	body.mobil #canvas-halter { position: absolute; }

	/* ---------- Layout „Mobil“: Ausschnitte frei angeordnet ---------- */
	#mobil { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 3px; overflow: hidden; }
	body.mobil #mobil { display: flex; }
	/* DOS-Pixel sind 1,2-mal so hoch wie breit */
	canvas.aus { width: 100%; height: auto; background: #000; }
	#mobil .voll { display: none; }
	#mobil.vollbild .teil { display: none; }
	#mobil.vollbild .voll { display: block; }

	/* ---------- Steuerleiste ---------- */
	#leiste {
		display: flex; align-items: center; justify-content: center; gap: 1rem;
		padding: 0.6rem 0.8rem;
		background: var(--panel);
		border-top: 1px solid var(--rand);
	}
	body:not(.mobil) #leiste { height: var(--leiste); }
	#icons-halter { width: 9.5rem; flex: none; }
	#mobil.vollbild ~ #leiste #icons-halter { display: none; }
	body:not(.mobil) #icons-halter { display: none; }
	#icons { border: 1px solid var(--rand); border-radius: 0.4rem; }
	.rechts { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
	.kreuz {
		display: grid; gap: 0.35rem;
		grid-template-columns: repeat(3, 3.3rem);
		grid-template-rows: repeat(2, 3.3rem);
	}
	.aktionen { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center; max-width: 11rem; }
	button {
		font: inherit; color: var(--text);
		background: var(--knopf);
		border: 1px solid var(--rand); border-radius: 0.6rem;
		touch-action: none;
		-webkit-tap-highlight-color: transparent;
		display: flex; align-items: center; justify-content: center;
		padding: 0;
	}
	button.aktiv { background: var(--knopf-aktiv); border-color: var(--gold); }
	.kreuz button { font-size: 1.5rem; }
	.kreuz .leer { visibility: hidden; }
	.aktionen button { font-size: 0.85rem; height: 2.3rem; padding: 0 0.7rem; }
	button svg { width: 1.5rem; height: 1.5rem; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

	/* ---------- Textboxen des Spiels als Overlay (nur mobil) ---------- */
	#dialog {
		position: fixed; inset: 0; z-index: 10;
		display: flex; flex-direction: column; justify-content: flex-end;
		background: rgb(0 0 0 / 0.45);
		padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	}
	#dialog[hidden], body:not(.mobil) #dialog { display: none; }
	#dialog [hidden] { display: none !important; }
	#dialog .karte {
		display: flex; flex-direction: column; gap: 0.9rem;
		max-height: 78dvh; overflow-y: auto; overscroll-behavior: contain;
		margin: 0 0.5rem 0.5rem;
		padding: 1.1rem 1.1rem 1rem;
		background: var(--panel);
		border: 1px solid var(--rand); border-radius: 0.9rem;
		box-shadow: 0 -0.3rem 1.5rem rgb(0 0 0 / 0.5);
		font: 1.12rem/1.45 Georgia, 'Times New Roman', serif;
		letter-spacing: 0.02em;
	}
	#dialog .kopf { display: flex; align-items: center; gap: 0.8rem; }
	#dialog .kopf:empty, #dialog .name:empty { display: none; }
	#dialog .portraet { width: 4.5rem; height: auto; aspect-ratio: 32 / 38.4; border: 1px solid var(--rand); border-radius: 0.3rem; flex: none; }
	#dialog .name { color: var(--gold); font-weight: bold; }
	#dialog .text:empty { display: none; }
	#dialog .zeile { display: flex; justify-content: space-between; gap: 1rem; min-height: 1.45em; }
	#dialog .zeile > span:first-child { flex: 1; }
	#dialog .f1 { color: var(--gold); }
	#dialog .f2 { color: #e0906a; }
	#dialog .f3 { color: #92b8dc; }
	#dialog .optionen { display: flex; flex-direction: column; gap: 0.45rem; }
	#dialog.janein .optionen { flex-direction: row; }
	#dialog.janein .optionen button { flex: 1; }
	#dialog .optionen button {
		justify-content: flex-start; text-align: left;
		min-height: 3rem; padding: 0.5rem 0.9rem;
		font: inherit; letter-spacing: inherit;
		touch-action: manipulation;
	}
	#dialog .optionen button .zeile { flex: 1; }
	/* lange Menüs (z. B. Kampf mit 13 Einträgen) kompakter */
	#dialog.dicht .optionen { gap: 0.3rem; }
	#dialog.dicht .optionen button { min-height: 2.5rem; padding: 0.3rem 0.9rem; font-size: 1.02rem; }
	#dialog .optionen button.vorwahl { border-color: var(--gold); }
	#dialog .optionen button.hervor { color: var(--gold); }
	#dialog .optionen button.frei { color: var(--leise); font-style: italic; }
	#dialog .eingabe { display: flex; gap: 0.5rem; }
	#dialog .eingabe input {
		flex: 1; min-width: 0; font: inherit; text-transform: uppercase;
		color: var(--text); background: var(--bg);
		border: 1px solid var(--rand); border-radius: 0.6rem; padding: 0.5rem 0.7rem;
	}
	/* iOS: ohne user-select lässt sich in das Feld nichts eintippen (body sperrt Auswahl) */
	#dialog .eingabe input { -webkit-user-select: text; user-select: text; }
	#dialog .schnellwahl { display: grid; grid-template-columns: repeat(auto-fit, minmax(2.9rem, 1fr)); gap: 0.4rem; }
	#dialog .schnellwahl button { min-height: 2.8rem; font: 1.05rem system-ui, sans-serif; touch-action: manipulation; }
	#dialog .fuss { display: flex; justify-content: flex-end; gap: 0.5rem; }
	#dialog .fuss button, #dialog .eingabe button { min-height: 2.8rem; padding: 0 1.1rem; font-size: 1rem; touch-action: manipulation; }
	#dialog .hinweis { color: var(--leise); font: 0.85rem system-ui, sans-serif; align-self: center; margin-right: auto; }
	#dialog.gesendet .karte { opacity: 0.6; }

	/* ---------- Spielstände ---------- */
	#verwaltung {
		position: fixed; inset: 0; z-index: 11;
		display: flex; flex-direction: column; justify-content: flex-end;
		background: rgb(0 0 0 / 0.55);
		padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	}
	#verwaltung[hidden] { display: none; }
	#verwaltung .karte {
		display: flex; flex-direction: column; gap: 0.7rem;
		max-height: 85dvh; overflow-y: auto;
		margin: 0 0.5rem 0.5rem; padding: 1.1rem;
		background: var(--panel); border: 1px solid var(--rand); border-radius: 0.9rem;
	}
	#verwaltung h2 { margin: 0; font: bold 1.2rem Georgia, serif; color: var(--gold); }
	#verwaltung p { margin: 0; font-size: 0.9rem; }
	#verwaltung .leise { color: var(--leise); }
	#verwaltung .plaetze { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.45rem; }
	#verwaltung .plaetze li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.7rem; background: var(--bg); border: 1px solid var(--rand); border-radius: 0.6rem; }
	#verwaltung .plaetze .name { flex: 1; font: 1.05rem Georgia, serif; letter-spacing: 0.03em; }
	#verwaltung .plaetze .name.frei { color: var(--leise); font-style: italic; }
	#verwaltung .plaetze button, #verwaltung .fuss button { min-height: 2.5rem; padding: 0 0.8rem; font-size: 0.9rem; touch-action: manipulation; }
	#verwaltung .fuss { display: flex; justify-content: flex-end; }
	#verwaltung .meldung:empty { display: none; }

	/* Querformat im Original-Layout: Leiste rechts */
	@media (orientation: landscape) and (max-height: 600px) {
		body:not(.mobil) { flex-direction: row; }
		body:not(.mobil) #bild { width: min(100%, calc(100dvh * 4 / 3)); }
		body:not(.mobil) #leiste { height: auto; width: 15rem; flex-direction: column; border-top: 0; border-left: 1px solid var(--rand); }
	}
</style>
</head>
<body class="mobil">
<div id="status">Lade …</div>

<!-- Original: SDL zeichnet hierhin -->
<div id="buehne">
	<div id="bild">
		<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
	</div>
</div>

<!-- Mobil: Ausschnitte aus dem 320x200-Bild (x, y, Breite, Höhe) -->
<div id="mobil">
	<canvas class="aus teil" data-aus="0,0,240,136" aria-label="Ansicht"></canvas>
	<canvas class="aus teil" data-aus="0,136,320,21" aria-label="Ortszeile"></canvas>
	<canvas class="aus teil" data-aus="0,157,320,43" aria-label="Gruppe"></canvas>
	<canvas class="aus voll" data-aus="0,0,320,200" aria-label="Bildschirm"></canvas>
</div>

<!-- Textbox des Spiels (Meldung, Auswahl, Eingabe), gefüllt von Module.dialogAuf -->
<div id="dialog" hidden role="dialog" aria-modal="true" aria-label="Spieltext">
	<div class="karte">
		<div class="kopf"></div>
		<div class="text"></div>
		<form class="eingabe" hidden>
			<input type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="Eingabe">
			<button type="submit">OK</button>
		</form>
		<div class="schnellwahl" hidden></div>
		<div class="optionen"></div>
		<div class="fuss">
			<span class="hinweis"></span>
			<button type="button" class="abbrechen">Abbrechen</button>
			<button type="button" class="weiter">Weiter</button>
		</div>
	</div>
</div>

<!-- Spielstände sichern: Export/Import der .GAM-Dateien (liegen sonst nur im Browser) -->
<div id="verwaltung" hidden role="dialog" aria-modal="true" aria-label="Spielstände">
	<div class="karte">
		<h2>Spielstände</h2>
		<p class="leise">Spielstände liegen im Speicher dieses Browsers. Exportierte Dateien sind eine Sicherung, etwa vor dem Löschen der Browserdaten oder für ein anderes Gerät.</p>
		<ol class="plaetze"></ol>
		<p class="meldung" role="status"></p>
		<div class="fuss"><button type="button" class="schliessen">Schließen</button></div>
	</div>
	<input type="file" accept=".gam,.GAM" hidden>
</div>

<div id="leiste">
	<div id="icons-halter">
		<canvas id="icons" class="aus" data-aus="241,57,78,78" aria-label="Aktionen"></canvas>
	</div>
	<div class="rechts">
		<div class="kreuz" aria-label="Bewegung">
			<button data-key="left" data-wdh aria-label="Links drehen" title="Links drehen (←)">
				<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
			</button>
			<button data-key="up" data-wdh aria-label="Vorwärts" title="Vorwärts (↑)">
				<svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
			</button>
			<button data-key="right" data-wdh aria-label="Rechts drehen" title="Rechts drehen (→)">
				<svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
			</button>
			<span class="leer"></span>
			<button data-key="down" data-wdh aria-label="Umdrehen / zurück" title="Zurück (↓)">
				<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
			</button>
			<span class="leer"></span>
		</div>
		<div class="aktionen" aria-label="Aktionen">
			<button data-key="enter" title="Bestätigen (Enter)">OK</button>
			<button data-key="rechtsklick" title="Abbrechen / Dialog schließen / Menü (Rechtsklick)">Zurück</button>
			<button data-key="j" title="Ja (J)">Ja</button>
			<button data-key="n" title="Nein (N)">Nein</button>
			<button id="layout" title="Zwischen mobilem und originalem Layout wechseln">Layout</button>
			<button id="spielstaende-knopf" title="Spielstände exportieren und importieren">Spielstände</button>
			<button id="vollbild" title="Vollbild">Vollbild</button>
		</div>
	</div>
</div>

<script>
	// SDL-Tastencodes, die das Spiel in sdl_event_loop() auswertet
	const TASTEN = {
		up: 0x40000052, down: 0x40000051, left: 0x40000050, right: 0x4000004F,
		enter: 13, esc: 27, j: 106, n: 110,
	};
	const statusEl = document.getElementById('status');
	const mobilEl = document.getElementById('mobil');

	// ---------- Ausschnitte ----------
	const ausschnitte = [...document.querySelectorAll('canvas.aus')].map((c) => {
		const [x, y, w, h] = c.dataset.aus.split(',').map(Number);
		c.width = w; c.height = h;
		c.style.aspectRatio = `${w} / ${h * 1.2}`;
		const ctx = c.getContext('2d');
		ctx.imageSmoothingEnabled = false;
		return { c, ctx, x, y, w, h };
	});
	const ganz = document.createElement('canvas');
	ganz.width = 320; ganz.height = 200;
	const ganzCtx = ganz.getContext('2d');
	const ganzBild = ganzCtx.createImageData(320, 200);

	// Antippen eines Ausschnitts -> Klick an der Originalkoordinate
	for (const a of ausschnitte) {
		a.c.addEventListener('pointerdown', (e) => {
			e.preventDefault();
			const r = a.c.getBoundingClientRect();
			const x = Math.floor(a.x + (e.clientX - r.left) / r.width * a.w);
			const y = Math.floor(a.y + (e.clientY - r.top) / r.height * a.h);
			Module._web_click?.(Math.min(319, x), Math.min(199, y), e.button === 2 ? 3 : 1);
		});
		a.c.addEventListener('contextmenu', (e) => e.preventDefault());
	}

	// vom Spiel nach jedem geänderten Bild aufgerufen (RGBA, Alpha 0)
	function neuesBild(heap, ptr, w, h) {
		if (w !== 320 || h !== 200) return;
		const quelle = heap.subarray(ptr, ptr + w * h * 4);
		const ziel = ganzBild.data;
		ziel.set(quelle);
		for (let i = 3; i < ziel.length; i += 4) ziel[i] = 255;
		ganzCtx.putImageData(ganzBild, 0, 0);

		const haupt = Module._web_screen_mode?.() === 1;
		if (!haupt) alleLoslassen();   // Meldung/Dialog: gehaltene Bewegung sofort beenden
		// Overlay offen: Ausschnitte auf dem Bild vor der Textbox festhalten (das Spiel gibt es
		// direkt vor dialogAuf aus), damit nur das Overlay zu sehen ist und nicht die Box des Spiels
		if (dialoge.length > 0 && document.body.classList.contains('mobil')) {
			if (dialoge.at(-1).bildPos) portraetZeichnen();
			return;
		}
		mobilEl.classList.toggle('vollbild', !haupt);
		for (const a of ausschnitte) {
			if (a.c.offsetParent === null) continue; // ausgeblendet
			a.ctx.drawImage(ganz, a.x, a.y, a.w, a.h, 0, 0, a.w, a.h);
		}
	}

	// ---------- Textboxen als Overlay ----------
	// Das Spiel meldet jede Textbox (seg097: web_dialog_auf/zu) und bleibt selbst zuständig für
	// Ablauf und Ergebnis; das Overlay schickt nur Tasten oder wählt einen Eintrag.
	const dialogEl = document.getElementById('dialog');
	const dKopf = dialogEl.querySelector('.kopf');
	const dText = dialogEl.querySelector('.text');
	const dOptionen = dialogEl.querySelector('.optionen');
	const dEingabe = dialogEl.querySelector('.eingabe');
	const dFeld = dEingabe.querySelector('input');
	const dWeiter = dialogEl.querySelector('.weiter');
	const dAbbrechen = dialogEl.querySelector('.abbrechen');
	const dHinweis = dialogEl.querySelector('.hinweis');
	const dSchnell = dialogEl.querySelector('.schnellwahl');
	// Tastendrücke im Eingabefeld nicht an SDL (lauscht am Fenster) weitergeben: sonst
	// verhindert SDL das Tippen bzw. das Spiel bekommt die Zeichen doppelt
	for (const typ of ['keydown', 'keyup', 'keypress']) dFeld.addEventListener(typ, (e) => e.stopPropagation());
	const dialoge = [];   // Stapel, falls eine Box eine weitere öffnet
	const DOS = { 0x8e: 'Ä', 0x99: 'Ö', 0x9a: 'Ü', 0x84: 'ä', 0x94: 'ö', 0x81: 'ü', 0xe1: 'ß' };
	// Zeichen der Spielschrift (seg096 g_gui_char_width); andere ASCII-Zeichen zeichnet das Spiel
	// als Lücke, z. B. „^“ in Geldbeträgen („3D^1S^5H“ → „3D 1S 5H“)
	const SCHRIFT = new Set(" ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz,.-()!?0123456789':#&%<>/_+");
	const zeichenText = (b) => DOS[b] ?? (b >= 0x20 && b < 0x7f
		? (SCHRIFT.has(String.fromCharCode(b)) ? String.fromCharCode(b) : ' ') : '');

	/** Spieltext (Bytes im DOS-Zeichensatz) als Zeilen: @ = Umbruch, ~ = Tabulator, 0xf0–f3 = Farbe */
	function spieltext(bytes, ziel) {
		ziel.replaceChildren();
		if (!bytes) return;
		let zeile, spalte, span = null, farbe = 0;
		const neueSpalte = () => { spalte = document.createElement('span'); zeile.append(spalte); span = null; };
		const neueZeile = () => { zeile = document.createElement('div'); zeile.className = 'zeile'; ziel.append(zeile); neueSpalte(); };
		const zeichen = (z) => {
			if (!span) { span = document.createElement('span'); if (farbe) span.className = 'f' + farbe; spalte.append(span); }
			span.textContent += z;
		};
		neueZeile();
		for (const b of bytes) {
			if (b === 0x40) neueZeile();
			else if (b === 0x7e) neueSpalte();
			else if (b >= 0xf0 && b <= 0xf3) { farbe = b - 0xf0; span = null; }
			else if (b === 0x0d || b === 0x0a) zeichen(' ');
			else if (zeichenText(b)) zeichen(zeichenText(b));
		}
	}
	const alsText = (bytes) => bytes ? bytes.map(zeichenText).join('') : '';

	function senden(fn) {
		const d = dialoge.at(-1);
		// nur eine Antwort je Box, und nur wenn der Tipp auf dem Overlay begonnen hat: sonst
		// schließt das Loslassen des Tipps, der die Box geöffnet hat, sie gleich wieder
		if (!d || d.gesendet || !d.gedrueckt) return;   // nur eine Antwort je Box (sonst landen Tasten im nächsten Bildschirm)
		d.gesendet = true;
		dialogEl.classList.add('gesendet');
		fn();
	}
	function portraetZeichnen() {
		const d = dialoge.at(-1);
		const c = dKopf.querySelector('canvas');
		if (!d?.bildPos || !c) return;
		c.getContext('2d').drawImage(ganz, d.bildPos[0], d.bildPos[1], 32, 32, 0, 0, 32, 32);
	}
	function zeigeDialog() {
		const d = dialoge.at(-1);
		dialogEl.hidden = !d;
		if (!d) return;
		dialogEl.classList.toggle('gesendet', !!d.gesendet);
		dialogEl.classList.toggle('janein', d.art === 3);
		dialogEl.classList.toggle('dicht', d.optionen.length > 7);
		dKopf.replaceChildren();
		if (d.bild) {
			const c = document.createElement('canvas');
			c.width = c.height = 32; c.className = 'portraet';
			dKopf.append(c);
		}
		if (d.name) { const n = document.createElement('div'); n.className = 'name'; spieltext(d.name, n); dKopf.append(n); }
		spieltext(d.text, dText);
		dOptionen.replaceChildren(...d.optionen.map((o, i) => {
			const b = document.createElement('button');
			b.type = 'button';
			spieltext(o, b);
			if (!alsText(o).trim()) { b.classList.add('frei'); b.textContent = 'frei'; }   // z. B. leerer Spielstandplatz
			b.classList.toggle('vorwahl', i === d.vorwahl);
			b.classList.toggle('hervor', i === d.hervor);
			b.addEventListener('click', () => senden(() => Module._web_menu_select(i + 1)));
			return b;
		}));
		const eingabe = d.art === 1 || d.art === 4;
		dEingabe.hidden = !eingabe;
		dSchnell.replaceChildren();
		dSchnell.hidden = true;
		if (eingabe) {
			const zahl = d.art === 4;
			dFeld.maxLength = d.zeichen;
			dFeld.value = alsText(d.vorgabe);
			dFeld.inputMode = zahl ? 'numeric' : 'text';
			dFeld.pattern = zahl ? '[0-9]*' : '.*';
			dFeld.autocapitalize = zahl ? 'off' : 'characters';
			// Bereich im Text, z. B. „(0-50)“: Werte zum Antippen
			const bereich = zahl && /\((\d+)\s*-\s*(\d+)\)/.exec(alsText(d.text));
			if (bereich) {
				const von = +bereich[1], bis = Math.min(+bereich[2], 10 ** d.zeichen - 1);
				const schritt = bis - von <= 10 ? 1 : Math.ceil((bis - von) / 6 / 5) * 5;
				const werte = [];
				for (let v = von; v < bis; v += schritt) werte.push(v);
				werte.push(bis);
				dSchnell.replaceChildren(...werte.map((v) => {
					const b = document.createElement('button');
					b.type = 'button';
					b.textContent = v;
					b.addEventListener('click', () => { dFeld.value = String(v); dEingabe.requestSubmit(); });
					return b;
				}));
				dSchnell.hidden = false;
			} else {
				setTimeout(() => dFeld.focus(), 0);   // ohne Schnellwahl gleich die Tastatur
			}
		}
		dWeiter.hidden = d.art !== 0;
		dAbbrechen.hidden = d.art === 0;
		dHinweis.textContent = d.art === 0 ? 'Tippen zum Weiterlesen' : '';
		portraetZeichnen();
	}
	dialogEl.addEventListener('pointerdown', () => { const d = dialoge.at(-1); if (d) d.gedrueckt = true; });
	// Meldung: Tippen irgendwo schließt (wie eine Taste im Original)
	dialogEl.addEventListener('click', () => {
		if (dialoge.at(-1)?.art === 0) senden(() => taste('enter'));
	});
	dAbbrechen.addEventListener('click', () => {
		const d = dialoge.at(-1);
		senden(() => (d.art === 1 || d.art === 4) ? Module._web_key(TASTEN.esc) : Module._web_right_click());
	});
	dEingabe.addEventListener('submit', (e) => {
		e.preventDefault();
		const d = dialoge.at(-1);
		let text = dFeld.value.toUpperCase().replace(/ß/g, 'SS');
		if (d.art === 4) text = text.replace(/[^0-9]/g, '');
		text = text.slice(0, d.zeichen);
		if (!text) { dFeld.focus(); return; }   // leer schließt das Spiel nicht, also gar nicht erst senden
		d.gedrueckt = true;   // Eingabe per Tastatur (Enter) ohne Tipp
		const codes = { Ä: 0x84, Ö: 0x94, Ü: 0x81 };
		dFeld.blur();
		senden(() => {
			for (let i = 0; i < d.zeichen; i++) Module._web_key(8);   // Vorgabe des Spiels löschen
			for (const z of text) {
				const c = codes[z] ?? z.toLowerCase().charCodeAt(0);
				if (c >= 0x20 && c <= 0x7a || c in { 0x81: 1, 0x84: 1, 0x94: 1 }) Module._web_key(c);
			}
			Module._web_key(13);
		});
	});

	var Module = {
		canvas: document.getElementById('canvas'),
		print: (t) => console.log(t),
		printErr: (t) => console.warn(t),
		setStatus: (t) => {
			statusEl.textContent = t;
			statusEl.style.display = t ? 'flex' : 'none';
		},
		onRuntimeInitialized: () => { statusEl.style.display = 'none'; },
		onFrame: neuesBild,
		dialogAuf: (d) => {
			dialoge.push(d);
			alleLoslassen();
			zeigeDialog();
		},
		// danach zeigt das nächste Bild des Spiels wieder alles (Box dort schon entfernt)
		dialogZu: () => { dialoge.pop(); zeigeDialog(); },
		dialogBild: (x, y) => {
			const d = dialoge.at(-1);
			if (d) { d.bildPos = [x, y]; portraetZeichnen(); }
		},
	};
	window.onerror = () => { Module.setStatus('Fehler – siehe Konsole'); };

	function taste(name) {
		if (name === 'rechtsklick') { Module._web_right_click?.(); return; }
		if (Module._web_key) Module._web_key(TASTEN[name]);
	}

	// Knöpfe: sofort beim Antippen auslösen, Bewegung beim Halten wiederholen.
	// Die Wiederholung muss sicher enden: iOS Safari meldet das Loslassen nicht
	// zuverlässig, wenn sich währenddessen das Layout ändert (Meldung erscheint).
	// Sonst läuft die Gruppe endlos weiter (z. B. immer wieder gegen ein Haus).
	const MAX_WDH = 40;            // ca. 9 s Dauerlauf
	const laufende = new Set();    // Enden-Funktionen der gerade gehaltenen Knöpfe
	function alleLoslassen() { for (const ende of [...laufende]) ende(); }
	function gruppe() {
		const v = Module._web_party_state?.();
		if (v === undefined) return null;
		return { x: v & 0xff, y: (v >> 8) & 0xff, richtung: (v >> 16) & 3, ort: (v >> 18) & 0xff };
	}
	for (const typ of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) {
		window.addEventListener(typ, alleLoslassen, true);
	}
	window.addEventListener('blur', alleLoslassen);   // nur das Fenster, nicht Elemente
	document.addEventListener('visibilitychange', alleLoslassen);

	for (const b of document.querySelectorAll('button[data-key]')) {
		let wdh = null;
		const ende = () => {
			b.classList.remove('aktiv');
			clearTimeout(wdh); clearInterval(wdh); wdh = null;
			laufende.delete(ende);
		};
		b.addEventListener('pointerdown', (e) => {
			e.preventDefault();
			ende();
			try { b.setPointerCapture(e.pointerId); } catch (_) { /* nicht überall möglich */ }
			b.classList.add('aktiv');
			taste(b.dataset.key);
			if (b.hasAttribute('data-wdh')) {
				laufende.add(ende);
				const schritt = b.dataset.key === 'up' || b.dataset.key === 'down';
				const start = gruppe();
				let vorher = start;
				let n = 0;
				wdh = setTimeout(() => {
					wdh = setInterval(() => {
						// Nur weiterlaufen, solange das Spiel normal Schritte macht: Abbruch bei
						// Dialog/Meldung, Ortswechsel, vom Spiel geänderter Richtung (z. B. aus
						// einem Haus zurückgesetzt), Stillstand (Wand) und nach MAX_WDH Wiederholungen.
						const jetzt = gruppe();
						const abbruch = Module._web_screen_mode?.() !== 1 || ++n > MAX_WDH || !jetzt ||
							jetzt.ort !== start.ort ||
							(schritt && (jetzt.richtung !== start.richtung || (jetzt.x === vorher.x && jetzt.y === vorher.y)));
						if (abbruch) { ende(); return; }
						vorher = jetzt;
						taste(b.dataset.key);
					}, 220);
				}, 380);
			}
		});
		b.addEventListener('lostpointercapture', ende);
		b.addEventListener('contextmenu', (e) => e.preventDefault());
	}

	// ---------- Spielstände: Export/Import ----------
	// GAMES.NAM: 5 Namen à 9 Bytes; Datei je Platz = Name auf 8 Zeichen (nicht alphanumerisch
	// und Rest „_“, wie prepare_sg_name in seg026) + „.GAM“, im Spielverzeichnis /spiel
	const verwaltungEl = document.getElementById('verwaltung');
	const vPlaetze = verwaltungEl.querySelector('.plaetze');
	const vMeldung = verwaltungEl.querySelector('.meldung');
	const vDatei = verwaltungEl.querySelector('input[type=file]');
	let importPlatz = -1;

	function spielstandNamen() {
		let nam;
		try { nam = FS.readFile('/spiel/GAMES.NAM'); } catch (e) { nam = new Uint8Array(45); }
		return [0, 1, 2, 3, 4].map((i) => {
			const b = nam.subarray(i * 9, i * 9 + 9);
			const ende = b.indexOf(0);
			return alsText([...b.subarray(0, ende < 0 ? 9 : ende)]);
		});
	}
	function dateiName(name) {
		let n = '';
		for (let i = 0; i < 8; i++) n += /[A-Za-z0-9]/.test(name[i] ?? '') ? name[i] : '_';
		return n + '.GAM';
	}
	function zeigeSpielstaende(meldung = '') {
		const namen = spielstandNamen();
		vPlaetze.replaceChildren(...namen.map((name, i) => {
			const li = document.createElement('li');
			const n = document.createElement('span');
			n.className = 'name' + (name ? '' : ' frei');
			n.textContent = name || 'frei';
			li.append(n);
			let vorhanden = false;
			try { vorhanden = !!name && FS.stat('/spiel/' + dateiName(name)); } catch (e) {}
			if (vorhanden) {
				const ex = document.createElement('button');
				ex.type = 'button'; ex.textContent = 'Exportieren';
				ex.addEventListener('click', () => exportieren(name));
				li.append(ex);
			}
			const im = document.createElement('button');
			im.type = 'button'; im.textContent = 'Importieren';
			im.addEventListener('click', () => { importPlatz = i; vDatei.value = ''; vDatei.click(); });
			li.append(im);
			return li;
		}));
		vMeldung.textContent = meldung;
	}
	function exportieren(name) {
		const daten = FS.readFile('/spiel/' + dateiName(name));
		const url = URL.createObjectURL(new Blob([daten], { type: 'application/octet-stream' }));
		const a = document.createElement('a');
		a.href = url; a.download = dateiName(name);
		document.body.append(a); a.click(); a.remove();
		setTimeout(() => URL.revokeObjectURL(url), 10000);
	}
	vDatei.addEventListener('change', async () => {
		const datei = vDatei.files?.[0];
		if (!datei || importPlatz < 0) return;
		const daten = new Uint8Array(await datei.arrayBuffer());
		// Kopf „DSA VERSION“, dann Spielzustand (5952) und Dateitabelle (286 × 4)
		const kennung = String.fromCharCode(...daten.subarray(0, 11));
		if (kennung !== 'DSA VERSION' || daten.length < 20 + 5952 + 286 * 4) {
			zeigeSpielstaende(`„${datei.name}“ ist kein Spielstand der Schicksalsklinge.`);
			return;
		}
		const name = datei.name.replace(/\.gam$/i, '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8) || `IMPORT${importPlatz + 1}`;
		const namen = spielstandNamen();
		const doppelt = namen.findIndex((n, i) => i !== importPlatz && dateiName(n) === dateiName(name));
		if (doppelt >= 0) { zeigeSpielstaende(`Der Name „${name}“ ist schon auf Platz ${doppelt + 1} vergeben.`); return; }
		if (namen[importPlatz] && !confirm(`Platz ${importPlatz + 1} („${namen[importPlatz]}“) überschreiben?`)) return;
		if (!confirm('Nach dem Import startet das Spiel neu. Nicht gespeicherter Fortschritt geht verloren. Fortfahren?')) return;
		try {
			if (namen[importPlatz]) { try { FS.unlink('/spiel/' + dateiName(namen[importPlatz])); } catch (e) {} }
			FS.writeFile('/spiel/' + dateiName(name), daten);
			const nam = new Uint8Array(45);
			try { nam.set(FS.readFile('/spiel/GAMES.NAM').subarray(0, 45)); } catch (e) {}
			nam.fill(0, importPlatz * 9, importPlatz * 9 + 9);
			for (let i = 0; i < name.length; i++) nam[importPlatz * 9 + i] = name.charCodeAt(i);
			FS.writeFile('/spiel/GAMES.NAM', nam);
		} catch (e) {
			zeigeSpielstaende('Import fehlgeschlagen: ' + e);
			return;
		}
		// das laufende Spiel kennt die Namen nur vom Start: sichern und neu starten
		Module.spielstaendeGesichert = (ok) => {
			Module.spielstaendeGesichert = null;
			if (ok) location.reload(); else zeigeSpielstaende('Import konnte nicht gesichert werden.');
		};
		Module.spielstaendeSichern();
	});
	document.getElementById('spielstaende-knopf').addEventListener('click', () => {
		zeigeSpielstaende();
		verwaltungEl.hidden = false;
	});
	verwaltungEl.querySelector('.schliessen').addEventListener('click', () => { verwaltungEl.hidden = true; });
	// Browser bitten, die Spielstände nicht bei Speicherknappheit zu löschen
	navigator.storage?.persist?.().catch(() => {});

	// Layout umschalten (wird im Browser gemerkt)
	function setzeLayout(mobil) {
		document.body.classList.toggle('mobil', mobil);
		try { localStorage.setItem('layout', mobil ? 'mobil' : 'original'); } catch (e) {}
	}
	try { if (localStorage.getItem('layout') === 'original') setzeLayout(false); } catch (e) {}
	document.getElementById('layout').addEventListener('click', () => setzeLayout(!document.body.classList.contains('mobil')));

	document.getElementById('vollbild').addEventListener('click', () => {
		if (document.fullscreenElement) document.exitFullscreen();
		else document.documentElement.requestFullscreen?.().catch(() => {});
	});
</script>
